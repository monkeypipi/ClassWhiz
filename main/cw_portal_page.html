<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ClassWhiz 配置</title>
<style>
:root {
  --bg: #f2f3f7;
  --card: #ffffff;
  --text: #1a1d26;
  --text-2: #6b7280;
  --text-3: #9ca3af;
  --accent: #4c8dff;
  --accent-dark: #2f6fe0;
  --danger: #ef4444;
  --success: #10b981;
  --border: #e8eaf0;
  --radius: 14px;
  --shadow: 0 2px 12px rgba(20,30,60,.07);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5; padding-bottom: 90px; }

/* 顶栏 */
.hero { background: linear-gradient(135deg, #141b33 0%, #1e2a52 60%, #24407c 100%); color: #fff; padding: 28px 20px 22px; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle, rgba(76,141,255,.35), transparent 70%); }
.hero h1 { font-size: 21px; font-weight: 700; letter-spacing: .5px; display: flex; align-items: center; gap: 8px; }
.hero h1 .logo { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), #8b5cf6); display: inline-flex; align-items: center; justify-content: center; font-size: 17px; }
.hero p { font-size: 12.5px; opacity: .62; margin-top: 5px; }
.hero .ip { display: inline-block; margin-top: 10px; font-size: 12px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.16); padding: 4px 12px; border-radius: 20px; font-family: ui-monospace, monospace; }

/* Tab */
.tabs { display: flex; background: var(--card); position: sticky; top: 0; z-index: 20; box-shadow: 0 1px 0 var(--border); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 1 0 auto; min-width: 72px; padding: 13px 10px 11px; text-align: center; font-size: 13.5px; color: var(--text-2); background: none; border: none; cursor: pointer; position: relative; font-weight: 500; transition: color .15s; }
.tab:active { color: var(--accent); }
.tab.active { color: var(--accent); font-weight: 700; }
.tab.active::after { content: ""; position: absolute; left: 22%; right: 22%; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--accent); }

/* 内容区 */
.content { padding: 14px 14px 0; max-width: 640px; margin: 0 auto; }
.tab-panel { display: none; animation: fade .18s ease; }
.tab-panel.active { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }

.section-title { font-size: 13px; font-weight: 700; color: var(--text-2); text-transform: uppercase; letter-spacing: .8px; margin: 6px 4px 10px; }

/* 卡片 */
.card { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); border: 1px solid rgba(0,0,0,.02); }
.card h3 { font-size: 15.5px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 7px; }
.card h3 .ico { font-size: 17px; }

/* 列表项 */
.item { border: 1px solid var(--border); border-radius: 12px; padding: 13px 14px; margin-bottom: 10px; background: #fff; transition: border-color .15s, box-shadow .15s; }
.item:active { border-color: var(--accent); }
.item-top { display: flex; align-items: center; gap: 9px; }
.item-title { font-weight: 700; font-size: 15px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-sub { font-size: 12.5px; color: var(--text-2); margin-top: 5px; line-height: 1.6; }
.item-actions { display: flex; gap: 8px; margin-top: 10px; }
.dot { width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
.tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 20px; background: #eef3ff; color: var(--accent-dark); font-weight: 600; margin-right: 4px; }

.empty { text-align: center; padding: 34px 16px; color: var(--text-3); }
.empty .big { font-size: 38px; margin-bottom: 8px; }
.empty p { font-size: 13px; }

/* 表单 */
.field { margin-bottom: 13px; }
.field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-2); margin-bottom: 6px; }
.field input, .field select { width: 100%; padding: 11px 13px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 15px; background: #fafbfc; color: var(--text); transition: border-color .15s, background .15s; appearance: none; }
.field input:focus, .field select:focus { outline: none; border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px rgba(76,141,255,.12); }
.field .hint { font-size: 11.5px; color: var(--text-3); margin-top: 5px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* 按钮 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 18px; border: none; border-radius: 11px; font-size: 14.5px; font-weight: 600; cursor: pointer; transition: transform .1s, opacity .15s; }
.btn:active { transform: scale(.97); }
.btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: #fff; width: 100%; box-shadow: 0 4px 14px rgba(76,141,255,.35); }
.btn-ghost { background: #eef1f6; color: var(--text); padding: 8px 14px; font-size: 13px; border-radius: 9px; }
.btn-danger-ghost { background: #fdeeee; color: var(--danger); padding: 8px 14px; font-size: 13px; border-radius: 9px; }
.btn-block { width: 100%; margin-top: 6px; }

/* 底部保存栏 */
.savebar { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: rgba(255,255,255,.92); backdrop-filter: blur(12px); border-top: 1px solid var(--border); z-index: 30; }
.savebar .btn-primary { margin: 0; }

/* Toast */
.toast { position: fixed; bottom: 86px; left: 50%; transform: translateX(-50%) translateY(10px); background: #1a1d26; color: #fff; padding: 11px 22px; border-radius: 24px; font-size: 13.5px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 100; box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: 88vw; text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* 排课弹窗 */
.modal { display: none; position: fixed; inset: 0; background: rgba(15,20,35,.55); z-index: 60; overflow-y: auto; backdrop-filter: blur(2px); }
.modal.open { display: block; animation: fade .15s ease; }
.modal-box { background: #fff; margin: 14px auto; max-width: 620px; border-radius: 18px; padding: 18px 16px; }
.modal-box h3 { font-size: 16.5px; margin-bottom: 4px; }
.modal-box .sub { font-size: 12.5px; color: var(--text-2); margin-bottom: 14px; }
.time-grid { display: grid; grid-template-columns: 44px repeat(7, 1fr); gap: 2px; font-size: 10px; }
.time-grid .th { text-align: center; padding: 6px 1px; font-weight: 700; background: #f1f4f9; border-radius: 6px; color: var(--text-2); font-size: 11px; }
.time-grid .tlbl { text-align: right; padding: 1px 5px 1px 0; color: var(--text-3); font-size: 9px; line-height: 22px; }
.time-grid .tlbl.hour { font-weight: 700; color: var(--text-2); font-size: 10px; }
.tcell { min-height: 22px; border: 1px solid #eef0f4; border-radius: 5px; cursor: pointer; background: #fbfcfe; }
.tcell:active { background: #e8efff; }
.tcell.mine { border-color: transparent; color: #fff; font-weight: 700; font-size: 9px; display: flex; align-items: center; justify-content: center; }
.tcell.other { border-color: transparent; color: #fff; opacity: .45; font-size: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; white-space: nowrap; }
.modal-btns { display: flex; gap: 10px; margin-top: 16px; }
.modal-btns .btn { flex: 1; }

/* 开关 */
.switch-row { display: flex; align-items: center; justify-content: space-between; padding: 13px 2px; border-bottom: 1px solid var(--border); }
.switch-row:last-child { border-bottom: none; }
.switch-row .lbl { font-size: 14.5px; font-weight: 600; }
.switch-row .desc { font-size: 12px; color: var(--text-2); margin-top: 2px; }
.switch { position: relative; width: 50px; height: 30px; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; inset: 0; background: #d6dae3; border-radius: 30px; transition: .2s; cursor: pointer; }
.slider::before { content: ""; position: absolute; width: 24px; height: 24px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
.switch input:checked + .slider { background: var(--accent); }
.switch input:checked + .slider::before { transform: translateX(20px); }

.footer-note { text-align: center; color: var(--text-3); font-size: 11.5px; padding: 18px 0 8px; }
</style>
</head>
<body>

<div class="hero">
  <h1><span class="logo">📚</span> ClassWhiz 配置</h1>
  <p>课程助手 · 网页配置门户</p>
  <span class="ip">http://192.168.4.1</span>
</div>

<div class="tabs" id="tabs">
  <button class="tab active" data-tab="courses">📅 课程</button>
  <button class="tab" data-tab="teachers">👨‍🏫 教师</button>
  <button class="tab" data-tab="tasks">✅ 任务</button>
  <button class="tab" data-tab="student">🎓 学生证</button>
  <button class="tab" data-tab="weather">🌤️ 天气</button>
  <button class="tab" data-tab="settings">⚙️ 设置</button>
</div>

<div class="content">

  <!-- 课程 -->
  <div id="panel-courses" class="tab-panel active">
    <div class="section-title">我的课程</div>
    <div id="course-list"></div>
    <button class="btn btn-ghost btn-block" onclick="addCourse()">＋ 添加课程</button>
  </div>

  <!-- 教师 -->
  <div id="panel-teachers" class="tab-panel">
    <div class="section-title">教师信息</div>
    <div id="teacher-list"></div>
    <button class="btn btn-ghost btn-block" onclick="addTeacher()">＋ 添加教师</button>
  </div>

  <!-- 任务 -->
  <div id="panel-tasks" class="tab-panel">
    <div class="section-title">作业 / 考试</div>
    <div id="task-list"></div>
    <button class="btn btn-ghost btn-block" onclick="addTask()">＋ 添加任务</button>
  </div>

  <!-- 学生证 -->
  <div id="panel-student" class="tab-panel">
    <div class="section-title">学生证信息</div>
    <div class="card">
      <h3><span class="ico">🎓</span> 基本信息</h3>
      <div class="grid2">
        <div class="field"><label>英文名</label><input id="stu-name-en" placeholder="Hang Zhang"></div>
        <div class="field"><label>中文名</label><input id="stu-name-zh" placeholder="张杭"></div>
      </div>
      <div class="field"><label>学号</label><input id="stu-id" placeholder="12345678" inputmode="numeric"></div>
      <div class="grid2">
        <div class="field"><label>学校 (EN)</label><input id="stu-uni-en" placeholder="UBC"></div>
        <div class="field"><label>学校 (中文)</label><input id="stu-uni-zh" placeholder="不列颠哥伦比亚大学"></div>
      </div>
    </div>
    <div class="card">
      <h3><span class="ico">📷</span> 证件照片</h3>
      <div class="field">
        <label>选择照片</label>
        <input type="file" id="stu-photo" accept="image/*">
        <div class="hint">任意尺寸均可，网页自动裁剪为 96×96 上传</div>
      </div>
      <button class="btn btn-ghost btn-block" onclick="uploadPhoto()">⤴️ 上传照片</button>
    </div>
  </div>

  <!-- 天气 -->
  <div id="panel-weather" class="tab-panel">
    <div class="section-title">天气城市</div>
    <div class="card">
      <div id="weather-list"></div>
      <div class="grid2" style="margin-top:12px;">
        <div class="field" style="margin:0;"><label>城市 (英文)</label><input id="wx-query" placeholder="Vancouver"></div>
        <div class="field" style="margin:0;"><label>显示名</label><input id="wx-label" placeholder="温哥华"></div>
      </div>
      <button class="btn btn-ghost btn-block" onclick="addCity()">＋ 添加城市</button>
      <div class="hint" style="font-size:11.5px;color:var(--text-3);margin-top:10px;">数据源 Open-Meteo（免费），需设备联网后生效</div>
    </div>
  </div>

  <!-- 设置 -->
  <div id="panel-settings" class="tab-panel">
    <div class="section-title">显示设置</div>
    <div class="card" style="padding: 4px 16px;">
      <div class="switch-row">
        <div><div class="lbl">中文界面</div><div class="desc">关闭则使用英文</div></div>
        <label class="switch"><input type="checkbox" id="set-lang"><span class="slider"></span></label>
      </div>
      <div class="switch-row">
        <div><div class="lbl">24 小时制</div><div class="desc">关闭则使用 12 小时制</div></div>
        <label class="switch"><input type="checkbox" id="set-time" checked><span class="slider"></span></label>
      </div>
      <div class="switch-row">
        <div><div class="lbl">摄氏度</div><div class="desc">关闭则使用华氏度</div></div>
        <label class="switch"><input type="checkbox" id="set-temp" checked><span class="slider"></span></label>
      </div>
    </div>
    <div class="card">
      <h3><span class="ico">🗑️</span> 危险区</h3>
      <button class="btn btn-danger-ghost btn-block" onclick="resetAll()">恢复出厂默认配置</button>
    </div>
  </div>

  <div class="footer-note">ClassWhiz · 保存后自动热更新，无需重启设备</div>
</div>

<div class="savebar">
  <button class="btn btn-primary" onclick="saveAll()">💾 保存全部配置</button>
</div>

<div class="toast" id="toast"></div>

<!-- 排课弹窗 -->
<div class="modal" id="sched-modal">
  <div class="modal-box">
    <h3 id="sched-title">排课</h3>
    <div class="sub">点按格子添加 / 取消该时段 · 有色格子为其他课程占用</div>
    <div class="time-grid" id="sched-grid"></div>
    <div class="modal-btns">
      <button class="btn btn-primary" onclick="closeSched(true)">确定</button>
      <button class="btn btn-ghost" onclick="closeSched(false)">取消</button>
    </div>
  </div>
</div>

<!-- 课程编辑弹窗 -->
<div class="modal" id="course-modal">
  <div class="modal-box">
    <h3 id="course-modal-title">编辑课程</h3>
    <div class="sub">修改课程基本信息</div>
    <div class="field"><label>课程代码</label><input id="ce-code" placeholder="CPSC 210"></div>
    <div class="grid2">
      <div class="field"><label>英文名</label><input id="ce-en" placeholder="Software Construction"></div>
      <div class="field"><label>中文名</label><input id="ce-zh" placeholder="软件构造"></div>
    </div>
    <div class="grid2">
      <div class="field"><label>教室</label><input id="ce-room" placeholder="ICCS X836"></div>
      <div class="field"><label>颜色</label><input id="ce-color" type="color" value="#4c8dff" style="height:44px;padding:4px;"></div>
    </div>
    <div class="modal-btns">
      <button class="btn btn-primary" onclick="closeCourseModal(true)">确定</button>
      <button class="btn btn-ghost" onclick="closeCourseModal(false)">取消</button>
    </div>
  </div>
</div>

<script>
let config = {courses:[], teachers:[], tasks:[], student:{}, weather:{cities:[]}};
let settings = {lang: 1, time24: 1, tempC: 1};

document.getElementById('tabs').addEventListener('click', e => {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
});

let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

async function loadConfig() {
  try {
    const r = await fetch('/api/config');
    config = await r.json();
    if (config.settings) {
      settings = config.settings;
      document.getElementById('set-lang').checked = !!settings.lang;
      document.getElementById('set-time').checked = !!settings.time24;
      document.getElementById('set-temp').checked = !!settings.tempC;
    }
    renderAll();
  } catch(e) { toast('⚠️ 加载配置失败，请检查连接'); }
}

function renderAll() { renderCourses(); renderTeachers(); renderTasks(); renderStudent(); renderWeather(); }
const hex = c => '#' + (c >>> 0).toString(16).padStart(6, '0');
const dayName = d => '一二三四五六日'[d];

/* ---------- 课程 ---------- */
function renderCourses() {
  const el = document.getElementById('course-list');
  if (!config.courses.length) {
    el.innerHTML = `<div class="empty"><div class="big">📅</div><p>还没有课程，点击下方按钮添加</p></div>`;
    return;
  }
  el.innerHTML = config.courses.map((c, i) => {
    const slots = c.slots.length
      ? c.slots.map(s => `<span class="tag">周${dayName(s.day)} ${fmtT(s.start)}-${fmtT(s.end)}</span>`).join('')
      : '<span style="color:var(--text-3);font-size:12.5px;">未排课</span>';
    return `<div class="item">
      <div class="item-top"><span class="dot" style="background:${hex(c.color)}"></span>
        <span class="item-title">${esc(c.code)} · ${esc(c.title_zh || c.title_en || '')}</span></div>
      <div class="item-sub">${esc(c.room || '未设教室')}</div>
      <div class="item-sub">${slots}</div>
      <div class="item-actions">
        <button class="btn btn-ghost" onclick="openSched(${i})">📅 排课</button>
        <button class="btn btn-ghost" onclick="openCourseModal(${i})">✏️ 编辑</button>
        <button class="btn btn-danger-ghost" onclick="delCourse(${i})">删除</button>
      </div>
    </div>`;
  }).join('');
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

function addCourse() {
  config.courses.push({code:'', title_en:'', title_zh:'', room:'', teacher:0, color:0x4c8dff, slots:[]});
  openCourseModal(config.courses.length - 1, true);
}
let editCourseIdx = -1, isNewCourse = false;
function openCourseModal(i, isNew) {
  editCourseIdx = i; isNewCourse = !!isNew;
  const c = config.courses[i];
  document.getElementById('course-modal-title').textContent = isNew ? '添加课程' : '编辑课程';
  document.getElementById('ce-code').value = c.code || '';
  document.getElementById('ce-en').value = c.title_en || '';
  document.getElementById('ce-zh').value = c.title_zh || '';
  document.getElementById('ce-room').value = c.room || '';
  document.getElementById('ce-color').value = hex(c.color);
  document.getElementById('course-modal').classList.add('open');
}
function closeCourseModal(save) {
  if (save && editCourseIdx >= 0) {
    const c = config.courses[editCourseIdx];
    c.code = document.getElementById('ce-code').value.trim();
    if (!c.code) { toast('课程代码不能为空'); return; }
    c.title_en = document.getElementById('ce-en').value.trim();
    c.title_zh = document.getElementById('ce-zh').value.trim();
    c.room = document.getElementById('ce-room').value.trim();
    c.color = parseInt(document.getElementById('ce-color').value.slice(1), 16);
    renderCourses();
    if (isNewCourse) openSched(editCourseIdx); // 新建后直接排课
  } else if (!save && isNewCourse && editCourseIdx >= 0) {
    config.courses.splice(editCourseIdx, 1); // 取消新建则移除
    renderCourses();
  }
  document.getElementById('course-modal').classList.remove('open');
  editCourseIdx = -1;
}
function delCourse(i) {
  if (!confirm(`删除课程 ${config.courses[i].code}？`)) return;
  config.courses.splice(i, 1); renderCourses();
}

/* ---------- 周历排课 (时间轴) ---------- */
let schedIdx = -1, schedDraft = []; // {day, start, end}
const DAY_START = 8 * 60;   // 08:00
const DAY_END = 20 * 60;    // 20:00
const SLOT = 30;            // 30 分钟一格

function openSched(i) {
  schedIdx = i;
  schedDraft = config.courses[i].slots.map(s => ({day: s.day, start: s.start, end: s.end}));
  document.getElementById('sched-title').textContent = '📅 排课：' + (config.courses[i].code || '新课程');
  renderSchedGrid();
  document.getElementById('sched-modal').classList.add('open');
}
function closeSched(save) {
  if (save && schedIdx >= 0) {
    config.courses[schedIdx].slots = schedDraft;
    config.courses[schedIdx].slots.sort((a, b) => a.day - b.day || a.start - b.start);
    renderCourses();
  }
  document.getElementById('sched-modal').classList.remove('open');
  schedIdx = -1;
}
function fmtT(m) { return Math.floor(m/60) + ':' + String(m%60).padStart(2,'0'); }
function renderSchedGrid() {
  const grid = document.getElementById('sched-grid');
  const cur = config.courses[schedIdx];
  let html = '<div class="th"></div>';
  ['一','二','三','四','五','六','日'].forEach(d => html += `<div class="th">周${d}</div>`);
  // 构建占用表: key = day*10000 + slotStart
  const occMap = {};
  config.courses.forEach((c, ci) => {
    c.slots.forEach(s => {
      for (let t = s.start; t < s.end; t += SLOT) {
        occMap[s.day * 100000 + t] = ci;
      }
    });
  });
  const draftMap = {};
  schedDraft.forEach(s => {
    for (let t = s.start; t < s.end; t += SLOT) {
      draftMap[s.day * 100000 + t] = true;
    }
  });
  for (let t = DAY_START; t < DAY_END; t += SLOT) {
    const isHour = t % 60 === 0;
    html += `<div class="tlbl${isHour ? ' hour' : ''}">${isHour ? fmtT(t) : ''}</div>`;
    for (let d = 0; d < 7; d++) {
      const key = d * 100000 + t;
      const mine = draftMap[key];
      const occ = occMap[key];
      let cls = 'tcell', style = '', label = '';
      if (mine) {
        cls += ' mine'; style = `background:${hex(cur.color)};`; label = cur.code || '●';
      } else if (occ !== undefined && occ !== schedIdx) {
        cls += ' other'; style = `background:${hex(config.courses[occ].color)};`;
        label = config.courses[occ].code;
      }
      html += `<div class="${cls}" style="${style}" onclick="toggleSlot(${d},${t})">${esc(label)}</div>`;
    }
  }
  grid.innerHTML = html;
}
// 点击格子:切换该 30 分钟块;按住连续点可扩展(简化:每次点切换 1 小时块)
function toggleSlot(day, t) {
  // 找是否已在 draft 中
  const idx = schedDraft.findIndex(s => s.day === day && s.start <= t && t < s.end);
  if (idx >= 0) {
    // 已有:移除这个 30min 块,可能拆分
    const s = schedDraft[idx];
    schedDraft.splice(idx, 1);
    if (s.start < t) schedDraft.push({day, start: s.start, end: t});
    if (t + SLOT < s.end) schedDraft.push({day, start: t + SLOT, end: s.end});
  } else {
    // 检查冲突
    const conflict = config.courses.findIndex((c, ci) =>
      ci !== schedIdx && c.slots.some(s => s.day === day && s.start < t + SLOT && t < s.end));
    if (conflict >= 0) {
      if (!confirm(`该时段已有 ${config.courses[conflict].code}，确定覆盖？`)) return;
      // 移除冲突
      config.courses[conflict].slots = config.courses[conflict].slots.flatMap(s => {
        if (s.day !== day || s.end <= t || s.start >= t + SLOT) return [s];
        const out = [];
        if (s.start < t) out.push({...s, end: t});
        if (s.end > t + SLOT) out.push({...s, start: t + SLOT});
        return out;
      });
    }
    // 尝试与相邻 draft 块合并
    let ns = t, ne = t + SLOT;
    const before = schedDraft.findIndex(s => s.day === day && s.end === ns);
    if (before >= 0) { ns = schedDraft[before].start; schedDraft.splice(before, 1); }
    const after = schedDraft.findIndex(s => s.day === day && s.start === ne);
    if (after >= 0) { ne = schedDraft[after].end; schedDraft.splice(after, 1); }
    schedDraft.push({day, start: ns, end: ne});
  }
  renderSchedGrid();
}

/* ---------- 教师 ---------- */
function renderTeachers() {
  const el = document.getElementById('teacher-list');
  if (!config.teachers.length) {
    el.innerHTML = `<div class="empty"><div class="big">👨‍🏫</div><p>还没有教师信息</p></div>`;
    return;
  }
  el.innerHTML = config.teachers.map((t, i) => {
    const hours = (t.hours || []).map(h => `<span class="tag">周${dayName(h.day)} ${fmtMin(h.start)}–${fmtMin(h.end)}</span>`).join('');
    return `<div class="item">
      <div class="item-top"><span class="item-title">${esc(t.name)}</span></div>
      <div class="item-sub">${esc(t.email || '')}${t.email && t.office ? ' · ' : ''}${esc(t.office || '')}</div>
      ${hours ? `<div class="item-sub" style="margin-top:6px;">${hours}</div>` : ''}
      <div class="item-actions"><button class="btn btn-danger-ghost" onclick="delTeacher(${i})">删除</button></div>
    </div>`;
  }).join('');
}
function fmtMin(m) { return String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0'); }
function addTeacher() {
  const name = prompt('教师姓名：');
  if (!name || !name.trim()) return;
  const email = prompt('邮箱（可空）：') || '';
  const office = prompt('办公室（可空）：') || '';
  config.teachers.push({name: name.trim(), dept: 0, email: email.trim(), office: office.trim(), courses: [], hours: []});
  renderTeachers(); toast('已添加，记得保存');
}
function delTeacher(i) {
  if (!confirm(`删除 ${config.teachers[i].name}？`)) return;
  config.teachers.splice(i, 1); renderTeachers();
}

/* ---------- 任务 ---------- */
function renderTasks() {
  const el = document.getElementById('task-list');
  if (!config.tasks.length) {
    el.innerHTML = `<div class="empty"><div class="big">✅</div><p>没有待办任务，享受空闲时光</p></div>`;
    return;
  }
  el.innerHTML = config.tasks.map((t, i) => `
    <div class="item">
      <div class="item-top"><span class="item-title">${esc(t.title)}</span>
        <span class="tag">${t.kind == 1 ? '考试' : '作业'}</span></div>
      <div class="item-sub">${esc(t.course || '')}${t.place ? ' · ' + esc(t.place) : ''}</div>
      <div class="item-actions"><button class="btn btn-danger-ghost" onclick="delTask(${i})">删除</button></div>
    </div>`).join('');
}
function addTask() {
  const title = prompt('任务标题：');
  if (!title || !title.trim()) return;
  const course = prompt('所属课程代码（可空）：') || '';
  const kind = confirm('是考试吗？\n[确定]=考试 [取消]=作业') ? 1 : 0;
  config.tasks.push({title: title.trim(), course: course.trim(), due_day_offset: 0, due_min: 1439, place: '', kind});
  renderTasks(); toast('已添加，记得保存');
}
function delTask(i) {
  if (!confirm('删除该任务？')) return;
  config.tasks.splice(i, 1); renderTasks();
}

/* ---------- 学生证 ---------- */
function renderStudent() {
  const s = config.student || {};
  document.getElementById('stu-name-en').value = s.name_en || '';
  document.getElementById('stu-name-zh').value = s.name_zh || '';
  document.getElementById('stu-id').value = s.student_id || '';
  document.getElementById('stu-uni-en').value = s.university_en || '';
  document.getElementById('stu-uni-zh').value = s.university_zh || '';
}
async function uploadPhoto() {
  const input = document.getElementById('stu-photo');
  if (!input.files || !input.files[0]) { toast('请先选择照片'); return; }
  toast('⏳ 转换上传中…');
  try {
    const img = await createImageBitmap(input.files[0]);
    const cv = document.createElement('canvas');
    cv.width = 96; cv.height = 96;
    const ctx = cv.getContext('2d');
    const s = Math.min(img.width, img.height);
    ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 96, 96);
    const id = ctx.getImageData(0, 0, 96, 96);
    const out = new Uint16Array(96 * 96);
    for (let i = 0; i < out.length; i++) {
      const r = id.data[i*4], g = id.data[i*4+1], b = id.data[i*4+2];
      out[i] = ((r & 0xF8) << 8) | ((g & 0xFC) << 3) | (b >> 3);
    }
    const r = await fetch('/api/photo', {method: 'POST',
      headers: {'Content-Type': 'application/octet-stream'}, body: out});
    const res = await r.json();
    toast(res.ok ? '✅ 照片上传成功' : '❌ 上传失败：' + (res.err || '未知错误'));
  } catch(e) { toast('❌ 处理失败：' + e.message); }
}

/* ---------- 天气 ---------- */
function renderWeather() {
  const el = document.getElementById('weather-list');
  const cities = (config.weather && config.weather.cities) || [];
  if (!cities.length) {
    el.innerHTML = `<div class="empty"><div class="big">🌤️</div><p>还没有添加城市</p></div>`;
    return;
  }
  el.innerHTML = cities.map((c, i) => `
    <div class="item"><div class="item-top"><span class="item-title">${esc(c.label || c.query)}</span>
      <button class="btn btn-danger-ghost" onclick="delCity(${i})">删除</button></div>
      <div class="item-sub">${esc(c.query)}</div></div>`).join('');
}
function addCity() {
  const q = document.getElementById('wx-query').value.trim();
  const l = document.getElementById('wx-label').value.trim();
  if (!q) { toast('请输入城市英文名'); return; }
  if (!config.weather) config.weather = {cities: []};
  if (config.weather.cities.length >= 4) { toast('最多 4 个城市'); return; }
  config.weather.cities.push({query: q, label: l || q});
  document.getElementById('wx-query').value = '';
  document.getElementById('wx-label').value = '';
  renderWeather();
}
function delCity(i) { config.weather.cities.splice(i, 1); renderWeather(); }

/* ---------- 保存 / 重置 ---------- */
function collectStudent() {
  config.student = {
    name_en: document.getElementById('stu-name-en').value.trim(),
    name_zh: document.getElementById('stu-name-zh').value.trim(),
    student_id: document.getElementById('stu-id').value.trim(),
    university_en: document.getElementById('stu-uni-en').value.trim(),
    university_zh: document.getElementById('stu-uni-zh').value.trim(),
    has_photo: (config.student && config.student.has_photo) || false,
  };
}
function collectSettings() {
  config.settings = {
    lang: document.getElementById('set-lang').checked ? 1 : 0,
    time24: document.getElementById('set-time').checked ? 1 : 0,
    tempC: document.getElementById('set-temp').checked ? 1 : 0,
  };
}
async function saveAll() {
  collectStudent(); collectSettings();
  toast('⏳ 保存中…');
  try {
    const r = await fetch('/api/config', {method: 'POST',
      headers: {'Content-Type': 'application/json'}, body: JSON.stringify(config)});
    const res = await r.json();
    toast(res.ok ? '✅ 保存成功，设备已热更新' : '❌ 保存失败');
  } catch(e) { toast('❌ 网络错误：' + e.message); }
}
async function resetAll() {
  if (!confirm('确定恢复出厂默认配置？当前修改将丢失。')) return;
  try {
    const r = await fetch('/api/reset', {method: 'POST'});
    const res = await r.json();
    if (res.ok) { await loadConfig(); toast('✅ 已恢复默认'); }
    else toast('❌ 重置失败');
  } catch(e) { toast('❌ 网络错误'); }
}

loadConfig();
